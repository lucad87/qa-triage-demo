name: demo pipe (Laya + DeepSeek)

on:
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Comma list of scenario ids (states already collected under runs/<id>/states)"
        required: true
        default: "env-wrong-baseurl,flake-random-patch-500,test-renamed-label-drift"
      verify:
        description: "Verify generated test-fix candidates by re-running the failing test"
        type: boolean
        default: true

concurrency:
  group: demo-pipe
  cancel-in-progress: true

jobs:
  demo-pipe:
    name: Laya decide + DeepSeek act + verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Kaggle CLI
        run: python -m pip install --quiet kaggle

      - name: Fetch fine-tuned model from the Kaggle kernel output (fp32)
        env:
          KAGGLE_USERNAME: lucad87
          KAGGLE_KEY: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels output lucad87/laya-triage-train -p model
          if [ ! -d model/onnx_fp32 ]; then
            echo "::error::fp32 bundle missing in the kernel output"
            exit 1
          fi
          echo "MODEL_DIR=model/onnx_fp32" >> "$GITHUB_ENV"
          du -sh model/onnx_fp32

      - name: Prepare demo run dirs (stored states)
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -e
          IFS=',' read -ra SCEN <<< "$SCENARIOS"
          for raw in "${SCEN[@]}"; do
            s="$(echo "$raw" | xargs)"
            [ -z "$s" ] && continue
            rm -rf "$RUNNER_TEMP/demo/$s"
            mkdir -p "$RUNNER_TEMP/demo/$s"
            cp -r "runs/$s/states" "$RUNNER_TEMP/demo/$s/states"
            echo "prepared $s ($(ls "$RUNNER_TEMP/demo/$s/states" | wc -l) files)"
          done

      - name: Decide with Laya (fine-tuned fp32, CPU)
        run: |
          set -e
          for d in "$RUNNER_TEMP"/demo/*/; do
            s="$(basename "$d")"
            echo "::group::decide $s"
            node scripts/triage/decide.mjs \
              --states "$d/states" \
              --out "$RUNNER_TEMP/demo/$s/decisions.json" \
              --model-dir "$MODEL_DIR"
            echo "::endgroup::"
          done

      - name: Act with DeepSeek (escalations to triage, patches, reports)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -e
          for d in "$RUNNER_TEMP"/demo/*/; do
            s="$(basename "$d")"
            echo "::group::act $s"
            if [ -z "$DEEPSEEK_API_KEY" ]; then
              echo "[demo] no DEEPSEEK_API_KEY secret - falling back to --dry-run"
              node scripts/triage/act.mjs --run "$RUNNER_TEMP/demo/$s" --dry-run
            else
              node scripts/triage/act.mjs --run "$RUNNER_TEMP/demo/$s"
            fi
            echo "::endgroup::"
          done

      - name: Install Playwright browser
        if: ${{ inputs.verify }}
        run: npx playwright install --with-deps chromium

      - name: Verify generated test-fix candidates
        if: ${{ inputs.verify }}
        run: |
          found=0
          for cand in "$RUNNER_TEMP"/demo/*/actions/*-spec.candidate.ts; do
            [ -f "$cand" ] || continue
            found=1
            state="$(basename "$cand" .ts)"
            state="${state%-spec.candidate}"
            actions_dir="$(dirname "$cand")"
            scen_dir="$(dirname "$actions_dir")"
            scen="$(basename "$scen_dir")"
            title="$(node -p 'require(process.argv[1]).test' "$scen_dir/states/$state.json" 2>/dev/null || true)"
            if [ -z "$title" ]; then
              echo "[demo] could not resolve the test title for $scen/$state - skipping verify"
              continue
            fi
            echo "::group::verify $scen / $state"
            if node scripts/triage/verify.mjs --candidate "$cand" --spec e2e/tasks.spec.ts --grep "$title" --scenario "$scen"; then
              echo "[demo] verify PASS for $scen/$state"
            else
              echo "[demo] verify FAIL (exit $?) for $scen/$state - see the result JSON next to the candidate"
            fi
            echo "::endgroup::"
          done
          if [ "$found" = "0" ]; then
            echo "[demo] no test-fix candidates were generated - nothing to verify"
          fi

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-pipe
          path: ${{ runner.temp }}/demo
          if-no-files-found: warn
