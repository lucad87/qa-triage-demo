name: e2e + triage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      collect_only:
        description: "Scenario ids for collect-corpus (comma list). Use 'all' for the whole corpus. Empty = collect-corpus skipped and trained-eval runs."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        run: npx playwright test
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            artifacts/results.json
            test-results/
            playwright-report/
          if-no-files-found: warn

  triage:
    name: Failure triage (Laya + DeepSeek)
    needs: e2e
    if: always() && needs.e2e.result != 'cancelled'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Restore Laya ONNX cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/receptron-laya
          key: laya-onnx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download Playwright results
        uses: actions/download-artifact@v4
        with:
          name: playwright-artifacts
      - name: Distill failures
        run: |
          changed=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" 2>/dev/null || true)
          node scripts/triage/distill.mjs \
            --results artifacts/results.json \
            --changed "$changed" \
            --out triage/states
      - name: Decide with Laya (CPU)
        if: ${{ hashFiles('triage/states/state-*.json') != '' }}
        run: node scripts/triage/decide.mjs --states triage/states --out triage/decisions.json
      - name: Act (LLM; dry-run when no API key is configured)
        if: ${{ hashFiles('triage/decisions.json') != '' }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            node scripts/triage/act.mjs --run triage --dry-run
          else
            node scripts/triage/act.mjs --run triage
          fi
      - name: Upload triage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: triage-results
          path: triage/
          if-no-files-found: ignore

  collect-corpus:
    name: Collect fault-scenario corpus (Linux)
    if: github.event_name == 'workflow_dispatch' && inputs.collect_only != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Collect scenarios
        run: |
          if [ "${{ inputs.collect_only }}" = "all" ]; then
            node scripts/triage/collect.mjs
          else
            node scripts/triage/collect.mjs --only "${{ inputs.collect_only }}"
          fi
      - name: Distill newly collected runs
        run: |
          set -e
          # Flake scenarios can be green on attempt 1; pick the first attempt that
          # actually has a failing/flaky spec, and skip the run if none does.
          for d in runs/*/; do
            id=$(basename "$d")
            if [ "$id" = "baseline" ]; then continue; fi
            if [ -f "${d}scenario.json" ] && [ ! -d "${d}states" ]; then
              pick=""
              for a in "${d}"attempt-*/; do
                [ -f "${a}results.json" ] || continue
                if node -e '
                  const fs = require("fs");
                  const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                  const bad = (s) => s === "failed" || s === "timedOut" || s === "interrupted";
                  let found = false;
                  const walk = (su) => {
                    for (const c of su.suites ?? []) walk(c);
                    for (const sp of su.specs ?? []) for (const t of sp.tests ?? []) {
                      const st = t.status;
                      const rs = (t.results ?? []).map((x) => x.status);
                      if (st === "unexpected" || st === "flaky" || rs.some(bad)) found = true;
                    }
                  };
                  for (const su of r.suites ?? []) walk(su);
                  process.exit(found ? 0 : 1);
                ' "${a}results.json"; then
                  pick="${a}results.json"
                  break
                fi
              done
              if [ -z "$pick" ]; then
                echo "=== skip ${id}: no failing or flaky attempt found"
                continue
              fi
              echo "=== distill ${id} (source: ${pick})"
              changed=$(node -p "require('./runs/${id}/scenario.json').changedFiles.join(',')")
              node scripts/triage/distill.mjs --results "${pick}" --changed "$changed" --scenario "${d}scenario.json" --out "${d}states"
            fi
          done
      - name: Regenerate fine-tune dataset
        run: node scripts/triage/make-finetune-dataset.mjs
      - name: Upload corpus artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-runs
          path: |
            runs/
            finetune/
          if-no-files-found: warn

  trained-eval:
    name: Trained-model eval (Laya fine-tuned, CPU)
    if: github.event_name == 'workflow_dispatch' && inputs.collect_only == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Kaggle CLI
        run: python -m pip install --quiet kaggle
      - name: Fetch fine-tuned model from the Kaggle kernel output
        env:
          KAGGLE_USERNAME: lucad87
          KAGGLE_KEY: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          kaggle kernels output lucad87/laya-triage-train -p model
          # NOTE (2026-09-29): the dynamo-int8 bundle loads and runs but flatlines outputs
          # (uniform ~0.25 probs on real states; the in-kernel dummy-input check missed it
          # because fp32 itself was saturated on the random input it compared against).
          # Use fp32 until an int8 validated on REAL inputs exists.
          MD=model/onnx_fp32
          echo "MODEL_DIR=$MD" >> "$GITHUB_ENV"
          ls -lh "$MD"
      - name: Decide with the fine-tuned model (all corpus runs)
        run: |
          set -e
          for d in runs/*/; do
            if [ -d "${d}states" ] && [ -f "${d}scenario.json" ]; then
              echo "=== ${d}"
              node scripts/triage/decide.mjs --states "${d}states" --out "${d}decisions-tuned.json" --model-dir "$MODEL_DIR"
              cp "${d}decisions-tuned.json" "${d}decisions.json"
            fi
          done
      - name: Evaluate
        run: node scripts/triage/eval.mjs
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tuned-eval-results
          path: |
            runs/eval-report.md
            runs/eval-report.json
            runs/*/decisions-tuned.json
          if-no-files-found: warn
